name: Build IPA Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Advanced CodeApp Architecture Build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar script de Frameworks de CodeApp
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Purgar Reglas de Desarrollo y Forzar Configuración Global limpia
        run: |
          # Elimina de raíz la validación de assets de desarrollo en el archivo de Xcode
          sed -i '' 's/DEVELOPMENT_ASSET_PATHS = [^;]*;//g' Code.xcodeproj/project.pbxproj
          
          # Fuerza el modo de firma automático y limpia cualquier amarre previo
          sed -i '' 's/ProvisioningStyle = Manual;/ProvisioningStyle = Automatic;/g' Code.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' Code.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";//g' Code.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;//g' Code.xcodeproj/project.pbxproj

      - name: Compilar Esquema Code App Bloqueando Errores Derivados
        run: |
          xcodebuild -project Code.xcodeproj \
            -scheme "Code App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedDataOutput \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_VALIDATION=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            EXTENSIONS_ALLOWED=NO \
            clean build

      - name: Empaquetar y Mover Estructura a appcodeplapla
        run: |
          mkdir -p Payload
          TARGET_APP=$(find ./DerivedDataOutput -name "Code App.app" -type d -o -name "Code.app" -type d | head -n 1)
          if [ -z "$TARGET_APP" ]; then
            TARGET_APP=$(find ./DerivedDataOutput -name "*.app" -type d | head -n 1)
          fi
          echo "Aplicación base localizada en: $TARGET_APP"
          cp -R "$TARGET_APP" Payload/
          zip -r appcodeplapla.ipa Payload

      - name: Descargar IPA Final para Ksign
        uses: actions/upload-artifact@v4
        with:
          name: appcodeplapla
          path: appcodeplapla.ipa
          if-no-files-found: error
