name: Build IPA Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Compilando IPA para Ksign
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar Frameworks Obligatorios de CodeApp
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Preparar Entorno sin Firmas
        run: |
          echo "CODE_SIGNING_ALLOWED=NO" >> $GITHUB_ENV
          echo "CODE_SIGNING_REQUIRED=NO" >> $GITHUB_ENV
          echo "CODE_SIGN_IDENTITY=" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_SPECIFIER=" >> $GITHUB_ENV

      - name: Compilar Proyecto en Xcode
        run: |
          xcodebuild -project Code.xcodeproj -scheme Code -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Empaquetar IPA Plano
        run: |
          mkdir -p Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphonesimulator/*.app Payload/ 2>/dev/null || cp -r build/Release-iphonesimulator/*.app Payload/
          zip -r appcodeplapla.ipa Payload

      - name: Enviar a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appcodeplapla
          path: appcodeplapla.ipa
