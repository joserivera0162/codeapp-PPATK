name: Build IPA Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Advanced CodeApp Architecture Build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Certificados Oficiales
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.KSIGN_P12_BASE64 }}
          p12-password: ${{ secrets.KSIGN_P12_PASSWORD }}

      - name: Instalar Perfiles de Provisión Ksign y Extraer Team ID
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.KSIGN_MOBILEPROVISION_BASE64 }}" | tr -d '\r\n ' | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          
          # Extrae inteligentemente el Team ID real de tus certificados de Ksign
          TEAM_ID=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision | grep -A 1 "TeamIdentifier" | grep "<string>" | sed -E 's/<\/?string>//g' | tr -d '[:space:]')
          echo "DETECTED_TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "Tu Team ID extraído es: $TEAM_ID"

      - name: Ejecutar script de Frameworks de CodeApp
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Parchear e Inyectar tu Team ID en Xcode
        run: |
          echo "Configurando de forma avanzada el proyecto con tu Team ID: $DETECTED_TEAM_ID"
          sed -i '' 's/ProvisioningStyle = Manual;/ProvisioningStyle = Automatic;/g' Code.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' Code.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";//g' Code.xcodeproj/project.pbxproj
          
          # Sobrescribe de raíz cualquier rastro del equipo viejo por tu Team ID real
          sed -i '' "s/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = $DETECTED_TEAM_ID/g" Code.xcodeproj/project.pbxproj
          
          # Asegura que todos los componentes apunten obligatoriamente a tu firma
          echo "CODE_SIGN_IDENTITY=iPhone Distribution" >> $GITHUB_ENV
          echo "DEVELOPMENT_TEAM=$DETECTED_TEAM_ID" >> $GITHUB_ENV

      - name: Compilar Esquema Code App de Forma Completa
        run: |
          xcodebuild -project Code.xcodeproj \
            -scheme "Code App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedDataOutput \
            DEVELOPMENT_TEAM="${{ env.DETECTED_TEAM_ID }}" \
            clean build

      - name: Empaquetar y Mover Estructura a appcodeplapla
        run: |
          mkdir -p Payload
          TARGET_APP=$(find ./DerivedDataOutput -name "Code App.app" -type d -o -name "Code.app" -type d | head -n 1)
          if [ -z "$TARGET_APP" ]; then
            TARGET_APP=$(find ./DerivedDataOutput -name "*.app" -type d | head -n 1)
          fi
          echo "Aplicación base localizada en: $TARGET_APP"
          cp -R "$TARGET_APP" Payload/
          zip -r appcodeplapla.ipa Payload

      - name: Descargar IPA Final para Ksign
        uses: actions/upload-artifact@v4
        with:
          name: appcodeplapla
          path: appcodeplapla.ipa
          if-no-files-found: error
