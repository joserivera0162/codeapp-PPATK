name: Build IPA Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Advanced CodeApp Architecture Build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Certificados Oficiales
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.KSIGN_P12_BASE64 }}
          p12-password: ${{ secrets.KSIGN_P12_PASSWORD }}

      - name: Instalar Perfiles de Provisión Ksign
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.KSIGN_MOBILEPROVISION_BASE64 }}" | tr -d '\r\n ' | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Ejecutar script de Frameworks de CodeApp
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Parchear e Inyectar tu Team ID de Forma Segura
        run: |
          REAL_TEAM_ID="ZXB3TS7QD4"
          echo "Configurando el proyecto con tu Team ID fijo: $REAL_TEAM_ID"
          
          # Forzar firma manual idéntica para limpiar el conflicto de Xcode
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' Code.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Code.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";//g' Code.xcodeproj/project.pbxproj
          sed -i '' "s/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = $REAL_TEAM_ID/g" Code.xcodeproj/project.pbxproj

      - name: Compilar Esquema Code App de Forma Completa
        run: |
          xcodebuild -project Code.xcodeproj \
            -scheme "Code App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedDataOutput \
            DEVELOPMENT_TEAM="ZXB3TS7QD4" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            clean build

      - name: Empaquetar y Mover Estructura a appcodeplapla
        run: |
          mkdir -p Payload
          TARGET_APP=$(find ./DerivedDataOutput -name "Code App.app" -type d -o -name "Code.app" -type d | head -n 1)
          if [ -z "$TARGET_APP" ]; then
            TARGET_APP=$(find ./DerivedDataOutput -name "*.app" -type d | head -n 1)
          fi
          echo "Aplicación base localizada en: $TARGET_APP"
          cp -R "$TARGET_APP" Payload/
          zip -r appcodeplapla.ipa Payload

      - name: Descargar IPA Final para Ksign
        uses: actions/upload-artifact@v4
        with:
          name: appcodeplapla
          path: appcodeplapla.ipa
          if-no-files-found: error
