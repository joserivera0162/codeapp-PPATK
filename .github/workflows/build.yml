name: Build CodeApp Advanced

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Advanced Compiling
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Certificados de Ksign en la Mac de GitHub
        env:
          P12_BASE64: ${{ secrets.KSIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.KSIGN_P12_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.KSIGN_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          
          # Solución al Error 1: Crear y desbloquear usando contraseña vacía ""
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Descargar Frameworks Obligatorios de CodeApp
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Instalar CocoaPods si aplica
        run: |
          if [ -f Podfile ]; then
            pod install
          fi

      - name: Compilar CodeUI Firmado con tus Certificados
        run: |
          xcodebuild -project Code.xcodeproj \
            -scheme CodeUI \
            -configuration Release \
            -sdk iphoneos \
            clean build

      - name: Empaquetar IPA Plano
        run: |
          mkdir -p Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r build/Release-iphoneos/*.app Payload/
          zip -r appcodeplapla.ipa Payload

      - name: Enviar a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appcodeplapla
          path: appcodeplapla.ipa
