name: Advanced CodeApp IPA Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Advanced Corporate Build
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Stable Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          xcodebuild -version

      - name: Execute CodeApp Framework Downloader
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Purge Framework Signatures & Extended Attributes
        run: |
          echo "Borrando metadatos corruptos y firmas antiguas de los sub-entornos..."
          find . -name "*.framework" -type d -exec xattr -cr {} +
          find . -name "*.framework" -type d -exec codesign --remove-signature {} + 2>/dev/null || true
          find . -name "*.a" -type f -exec xattr -cr {} +
          find . -name "*.dylib" -type f -exec xattr -cr {} +

      - name: Deep Code-Sign Override Configuration
        run: |
          echo "CODE_SIGNING_ALLOWED=YES" >> $GITHUB_ENV
          echo "CODE_SIGNING_REQUIRED=NO" >> $GITHUB_ENV
          echo "CODE_SIGN_IDENTITY=-" >> $GITHUB_ENV
          echo "AD_HOC_CODE_SIGNING_ALLOWED=YES" >> $GITHUB_ENV

      - name: Execute Advanced Xcode Engine Compilation
        run: |
          xcodebuild -project Code.xcodeproj \
            -scheme CodeUI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedDataOutput \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Structure and Compress Final IPA Package
        run: |
          echo "Estructurando jerarquía de instalación iOS..."
          mkdir -p Payload
          TARGET_APP=$(find ./DerivedDataOutput -name "CodeUI.app" -type d | head -n 1)
          if [ -z "$TARGET_APP" ]; then
            TARGET_APP=$(find ./DerivedDataOutput -name "*.app" -type d | head -n 1)
          fi
          echo "Aplicación localizada en: $TARGET_APP"
          cp -R "$TARGET_APP" Payload/
          zip -r appcodeplapla.ipa Payload

      - name: Dispatch Production Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: appcodeplapla
          path: appcodeplapla.ipa
          if-no-files-found: error
