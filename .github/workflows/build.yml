name: Build IPA Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Compilando IPA para Ksign
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compilar Binario Nativo
        run: |
          if [ -d *.xcworkspace ]; then
            WORKSPACE_NAME=$(basename *.xcworkspace)
            SCHEME_NAME=$(xcodebuild -workspace "$WORKSPACE_NAME" -list | sed -n '/Schemes:/,$p' | sed -n '3p' | sed 's/^[ \t]*//')
            xcodebuild -workspace "$WORKSPACE_NAME" -scheme "$SCHEME_NAME" -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
          else
            PROJECT_NAME=$(basename *.xcodeproj)
            SCHEME_NAME=$(xcodebuild -project "$PROJECT_NAME" -list | sed -n '/Schemes:/,$p' | sed -n '3p' | sed 's/^[ \t]*//')
            xcodebuild -project "$PROJECT_NAME" -scheme "$SCHEME_NAME" -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
          fi

      - name: Empaquetar IPA Plano
        run: |
          mkdir -p Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphonesimulator/*.app Payload/ 2>/dev/null || cp -r build/Release-iphonesimulator/*.app Payload/
          zip -r appcodeplapla.ipa Payload

      - name: Enviar a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appcodeplapla
          path: appcodeplapla.ipa
