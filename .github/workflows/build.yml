name: Build IPA Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Advanced CodeApp Architecture Build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear Identidad de Firma Nativa Temporal
        run: |
          # Crea un llavero local inmune al error de firmas y una identidad Ad-Hoc reconocida por el Linker de Xcode
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

      - name: Ejecutar script de Frameworks de CodeApp
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Instalar Dependencias de CocoaPods
        run: |
          pod install

      - name: Compilar Esquema Code App de Forma Completa
        run: |
          xcodebuild -project Code.xcodeproj \
            -scheme "Code App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedDataOutput \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build

      - name: Empaquetar y Mover Estructura a appcodeplapla
        run: |
          mkdir -p Payload
          TARGET_APP=$(find ./DerivedDataOutput -name "Code.app" -type d | head -n 1)
          if [ -z "$TARGET_APP" ]; then
            TARGET_APP=$(find ./DerivedDataOutput -name "*.app" -type d | head -n 1)
          fi
          echo "Aplicación base localizada en: $TARGET_APP"
          cp -R "$TARGET_APP" Payload/
          zip -r appcodeplapla.ipa Payload

      - name: Descargar IPA Final para Ksign
        uses: actions/upload-artifact@v4
        with:
          name: appcodeplapla
          path: appcodeplapla.ipa
          if-no-files-found: error
