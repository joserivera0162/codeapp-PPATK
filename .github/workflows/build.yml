name: Build CodeApp Advanced
on: [workflow_dispatch]

jobs:
  deploy:
    name: Advanced Compiling
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Certificados de Ksign en la Mac de GitHub
        env:
          P12_BASE64: ${{ secrets.KSIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.KSIGN_P12_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.KSIGN_MOBILEPROVISION_BASE64 }}
        run: |
          # Crear llavero temporal en la Mac
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          
          security create-keychain -p "github-pass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "github-pass" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "github-pass" build.keychain

      - name: Descargar Frameworks
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Compilar e Inyectar Firma Real
        run: |
          xcodebuild -project Code.xcodeproj \
            -scheme CodeUI \
            -configuration Release \
            -sdk iphoneos \
            clean build

      - name: Package
        run: |
          mkdir -p Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
          zip -r appcodeplapla.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: appcodeplapla
          path: appcodeplapla.ipa
