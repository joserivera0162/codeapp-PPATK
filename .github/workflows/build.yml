name: Build IPA Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Advanced CodeApp Simulator Patch Build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar Frameworks Obligatorios de CodeApp
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Compilar Código Base Ignorando Extensiones Conflictivas
        run: |
          xcodebuild -project Code.xcodeproj \
            -scheme "Code" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ./DerivedDataOutput \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            clean build

      - name: Empaquetar y Parchear Estructura para Ksign
        run: |
          mkdir -p Payload
          # Localiza el ejecutable de Code compilado
          TARGET_APP=$(find ./DerivedDataOutput -name "Code.app" -type d | head -n 1)
          if [ -z "$TARGET_APP" ]; then
            TARGET_APP=$(find ./DerivedDataOutput -name "*.app" -type d | head -n 1)
          fi
          echo "Aplicación base localizada en: $TARGET_APP"
          cp -R "$TARGET_APP" Payload/
          
          # Forzar compatibilidad cambiando los requisitos de arquitectura del info.plist
          # Esto engaña a Ksign para que lo tome como una app de iPhone física pura
          if [ -f Payload/Code.app/Info.plist ]; then
            plutil -replace LSRequiresIPhoneOS -bool true Payload/Code.app/Info.plist 2>/dev/null || true
          fi
          
          zip -r appcodeplapla.ipa Payload

      - name: Enviar IPA Final a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appcodeplapla
          path: appcodeplapla.ipa
          if-no-files-found: error
